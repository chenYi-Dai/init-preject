server:
  port: 9009
spring:
  ai:
    dashscope:
      api-key: sk-0bd4236fe8db4d5eb74ebf4eae645528
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/sys?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: root
    type: com.alibaba.druid.pool.DruidDataSource
  application:
    name: initial-project # 定义当前服务名称
#  cloud:
#    nacos:
#      discovery:
#        server-addr: 47.106.146.101:8848 # 指定正在运行的Nacos服务器的位置
  kafka:
    bootstrap-servers: 9.134.238.192:9092 #这个是kafka的地址,对应你server.properties中配置的
    producer:
      batch-size: 16384 #批量大小
      acks: -1 #应答级别:多少个分区副本备份完成时向生产者发送ack确认(可选0、1、all/-1)
      retries: 10 # 消息发送重试次数
      #transaction-id-prefix: transaction
      buffer-memory: 33554432
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        linger:
          ms: 2000 #提交延迟
          #partitioner: #指定分区器
          #class: pers.zhang.config.CustomerPartitionHandler
    consumer:
      bootstrap-servers: 9.134.238.192:9092
      group-id: testGroup #默认的消费组ID
      enable-auto-commit: true #是否自动提交offset
      auto-commit-interval: 2000 #提交offset延时
      # 当kafka中没有初始offset或offset超出范围时将自动重置offset
      # earliest:重置为分区中最小的offset;
      # latest:重置为分区中最新的offset(消费分区中新产生的数据);
      # none:只要有一个分区不存在已提交的offset,就抛出异常;
      auto-offset-reset: latest
      max-poll-records: 500 #单次拉取消息的最大条数
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        session:
          timeout:
            ms: 120000 # 消费会话超时时间（超过这个时间 consumer 没有发送心跳，就会触发 rebalance 操作）
        request:
          timeout:
            ms: 18000 # 消费请求的超时时间
    listener:
      missing-topics-fatal: false # consumer listener topics 不存在时，启动项目就会报错
    template:
      default-topic: test-topic-name
  #      type: batch


stop:
  case: false
dashscope:
  api-key: sk-0bd4236fe8db4d5eb74ebf4eae645528
  model-name: qwen-plus

mysql:
  url: jdbc:mysql://localhost:3306/sys
  name: root
  pwd: root
  driver-class: com.mysql.cj.jdbc.Driver
seata:
  tx-service-group: default_tx_group # 定义当前微服务的事务分组名
  service:
    vgroup-mapping:
      default_tx_group: default # 将 default_tx_group 映射到名为 'default' 的 TC 集群
  registry:
    type: file # 如果TC也是单机file模式，保持一致


springdoc:
  swagger-ui:
    enabled: true # 必须改为true，开启Swagger UI
    path: /swagger-ui.html
  api-docs:
    enabled: true # 必须改为true，开启API文档生成
    path: /v3/api-docs

knife4j:
  enable: true
  basic:
    enable: true
    username: admin
    password: admin
  setting:
    language: zh_cn
    enable-version: true
    enable-footer: false